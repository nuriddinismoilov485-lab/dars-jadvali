<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Dars jadvali</title>

<!-- iPhone / iOS uchun "ilova kabi" ochilishi -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Dars jadvali">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

<!-- Android / umumiy PWA -->
<meta name="theme-color" content="#101012">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap');

  :root{
    --bg:#101012;
    --card:#19191C;
    --card-now:#222226;
    --border:#28282B;
    --border-soft:#1E1E21;
    --ink:#F4F4F5;
    --muted:#96979C;
    --faint:#5A5B60;
    --accent:#FAFAFA;
  }

  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{
    margin:0; padding:0; height:100%;
    background:var(--bg);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    overflow:hidden;
    overscroll-behavior:none;
  }

  .app{
    max-width:480px;
    margin:0 auto;
    height:100vh;
    height:100dvh;
    display:flex;
    flex-direction:column;
    position:relative;
    padding-top:env(safe-area-inset-top);
    padding-bottom:env(safe-area-inset-bottom);
  }

  /* ---------- header ---------- */
  .topbar{ padding:22px 20px 0; flex-shrink:0; }
  .eyebrow{
    display:flex; justify-content:space-between; align-items:center;
  }
  .eyebrow .label{
    font-size:11.5px; font-weight:600; color:var(--faint);
    text-transform:uppercase; letter-spacing:.06em;
  }
  .eyebrow .count{
    font-size:12px; color:var(--muted);
    background:var(--card);
    border:1px solid var(--border);
    padding:4px 10px;
    border-radius:20px;
  }
  .eyebrow .count b{ color:var(--ink); font-weight:600; }

  .daylabel{ margin-top:10px; display:flex; align-items:baseline; gap:10px; }
  .daylabel h1{
    font-family:'Space Grotesk',sans-serif;
    font-weight:600;
    font-size:29px;
    margin:0;
    letter-spacing:-0.01em;
    color:var(--ink);
  }
  .daylabel .date{ font-size:15px; color:var(--muted); font-weight:500; }

  /* ---------- segmented day strip ---------- */
  .daystrip{
    position:relative;
    display:grid;
    grid-template-columns:repeat(7,1fr);
    gap:4px;
    margin:20px 20px 4px;
    padding:4px;
    background:var(--card);
    border:1px solid var(--border);
    border-radius:14px;
    flex-shrink:0;
  }
  .indicator{
    position:absolute;
    top:4px; bottom:4px; left:4px;
    background:var(--accent);
    border-radius:10px;
    transition:transform .28s cubic-bezier(.22,.61,.36,1), width .28s cubic-bezier(.22,.61,.36,1);
    z-index:1;
  }
  .pill{
    position:relative; z-index:2;
    text-align:center; padding:8px 0 7px;
    cursor:pointer; user-select:none;
    border-radius:10px;
  }
  .pill .pd{ font-size:10.5px; color:var(--muted); font-weight:600; text-transform:lowercase; transition:color .2s ease; }
  .pill .pn{ font-size:14px; font-weight:600; margin-top:2px; color:var(--ink); transition:color .2s ease; }
  .pill.active .pd{ color:#101012; }
  .pill.active .pn{ color:#101012; }
  .pill.today:not(.active) .pd{ color:var(--ink); }

  /* ---------- swipe viewport ---------- */
  .viewport{ flex:1; overflow:hidden; position:relative; touch-action:pan-y; }
  .track{ display:flex; height:100%; will-change:transform; }
  .day-pane{ min-width:100%; height:100%; overflow-y:auto; padding:20px 20px 24px; -webkit-overflow-scrolling:touch; }

  /* ---------- lesson list ---------- */
  .list{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:18px;
    overflow:hidden;
  }
  .row{
    display:flex; align-items:center; gap:13px;
    padding:15px 16px;
    border-bottom:1px solid var(--border-soft);
  }
  .row:last-child{ border-bottom:none; }
  .row .num{ width:18px; flex-shrink:0; font-size:12px; font-weight:600; color:var(--faint); }
  .row .info{ flex:1; min-width:0; }
  .row .subj{ font-size:15px; font-weight:600; color:var(--ink); }
  .row .teacher{ font-size:12.5px; color:var(--muted); margin-top:3px; }
  .row.now{ background:var(--card-now); }
  .row.now .num{ color:var(--accent); }
  .now-tag{
    flex-shrink:0;
    font-size:10px; font-weight:700; letter-spacing:.02em;
    color:#101012; background:var(--accent);
    padding:4px 9px; border-radius:20px;
  }

  /* ---------- rest day ---------- */
  .restday{
    height:100%; display:flex; flex-direction:column;
    align-items:center; justify-content:center; text-align:center;
    padding:0 40px; color:var(--muted);
  }
  .restday .glyph{
    width:46px; height:46px; border-radius:50%;
    border:1px solid var(--border);
    background:var(--card);
    display:flex; align-items:center; justify-content:center;
    margin-bottom:16px;
  }
  .restday h2{ font-family:'Space Grotesk',sans-serif; font-weight:600; font-size:19px; color:var(--ink); margin:0 0 6px; }
  .restday p{ font-size:13.5px; margin:0; line-height:1.5; }

  /* ---------- pagination dots ---------- */
  .dots{ display:flex; justify-content:center; gap:6px; padding:14px 0 18px; flex-shrink:0; }
  .dots span{
    width:5px; height:5px; border-radius:50%;
    background:var(--border);
    transition:background .2s ease, transform .2s ease, width .2s ease;
  }
  .dots span.on{ background:var(--accent); width:14px; border-radius:3px; }

  @media (min-width:481px){
    .app{ border-left:1px solid var(--border); border-right:1px solid var(--border); }
  }
</style>
</head>
<body>
<div class="app">

  <div class="topbar">
    <div class="eyebrow">
      <span class="label">7–13 sentyabr</span>
      <span class="count"><b id="lessonCount">0</b> ta dars</span>
    </div>
    <div class="daylabel">
      <h1 id="dayName">—</h1>
      <span class="date" id="dayDate">—</span>
    </div>
  </div>

  <div class="daystrip" id="dayStrip">
    <div class="indicator" id="indicator"></div>
  </div>

  <div class="viewport" id="viewport">
    <div class="track" id="track"></div>
  </div>

  <div class="dots" id="dots"></div>

</div>

<script>
const WEEK = [
  { name:'Dushanba', short:'Du', date:'7 sen', iso:'2026-09-07', lessons:[
    {t1:'08:00',t2:'08:45', subj:'Kelajak soati', teacher:'Ibragimova D.A.'},
    {t1:'08:50',t2:'09:35', subj:'Adabiyot', teacher:'Ibragimova D.A.'},
    {t1:'09:40',t2:'10:25', subj:'Geografiya', teacher:"Qo'ziboyev H.S."},
    {t1:'10:45',t2:'11:30', subj:'Kimyo', teacher:'Abdurahimova X.'},
    {t1:'11:35',t2:'12:20', subj:'Jismoniy tarbiya', teacher:'Rayimberdiyev M.'},
    {t1:'12:25',t2:'13:10', subj:'Rus tili', teacher:'Xasanova D.S.'},
  ]},
  { name:'Seshanba', short:'Se', date:'8 sen', iso:'2026-09-08', lessons:[
    {t1:'08:00',t2:'08:45', subj:'Algebra', teacher:'Sobirjonova M.R.'},
    {t1:'08:50',t2:'09:35', subj:'Geometriya', teacher:'Sobirjonova M.R.'},
    {t1:'09:40',t2:'10:25', subj:'Biologiya', teacher:'Yusupova G.M.'},
    {t1:'10:45',t2:'11:30', subj:'Jahon tarixi', teacher:'Xusanov A.A.'},
    {t1:'11:35',t2:'12:20', subj:'Geografiya', teacher:"Qo'ziboyev H.S."},
  ]},
  { name:'Chorshanba', short:'Cho', date:'9 sen', iso:'2026-09-09', lessons:[
    {t1:'08:00',t2:'08:45', subj:'ChQBT', teacher:'Orifjonov S.A.'},
    {t1:'08:50',t2:'09:35', subj:'Tarbiya', teacher:'Tojiyeva M.N.'},
    {t1:'09:40',t2:'10:25', subj:'Ona tili', teacher:'Ibragimova D.A.'},
    {t1:'10:45',t2:'11:30', subj:'Informatika', teacher:"A'zamov O.O."},
    {t1:'11:35',t2:'12:20', subj:'DHA', teacher:'Tojiyeva M.N.'},
  ]},
  { name:'Payshanba', short:'Pay', date:'10 sen', iso:'2026-09-10', lessons:[
    {t1:'08:00',t2:'08:45', subj:'Adabiyot', teacher:'Ibragimova D.A.'},
    {t1:'08:50',t2:'09:35', subj:'Rus tili', teacher:'Xasanova D.S.'},
    {t1:'09:40',t2:'10:25', subj:"O'zbekiston tarixi", teacher:'Xusanov A.A.'},
    {t1:'10:45',t2:'11:30', subj:'Fizika', teacher:'Sufiyeva M.N.'},
    {t1:'11:35',t2:'12:20', subj:'Ingliz tili', teacher:'Marufov A.D.'},
    {t1:'12:25',t2:'13:10', subj:'ChQBT', teacher:'Orifjonov S.A.'},
  ]},
  { name:'Juma', short:'Ju', date:'11 sen', iso:'2026-09-11', lessons:[
    {t1:'08:00',t2:'08:45', subj:'Biologiya', teacher:'Yusupova G.M.'},
    {t1:'08:50',t2:'09:35', subj:'Algebra', teacher:'Sobirjonova M.R.'},
    {t1:'09:40',t2:'10:25', subj:'Ona tili', teacher:'Ibragimova D.A.'},
    {t1:'10:45',t2:'11:30', subj:'Geometriya', teacher:'Sobirjonova M.R.'},
    {t1:'11:35',t2:'12:20', subj:'Kimyo', teacher:'Abdurahimova X.'},
    {t1:'12:25',t2:'13:10', subj:'Informatika', teacher:"A'zamov O.O."},
  ]},
  { name:'Shanba', short:'Sha', date:'12 sen', iso:'2026-09-12', lessons:[
    {t1:'08:00',t2:'08:45', subj:'Ingliz tili', teacher:'Marufov A.D.'},
    {t1:'08:50',t2:'09:35', subj:'Fizika', teacher:'Sufiyeva M.N.'},
    {t1:'09:40',t2:'10:25', subj:'Algebra', teacher:'Sobirjonova M.R.'},
    {t1:'10:45',t2:'11:30', subj:'Informatika', teacher:"A'zamov O.O."},
  ]},
  { name:'Yakshanba', short:'Ya', date:'13 sen', iso:'2026-09-13', lessons:[] },
];

const dayStrip = document.getElementById('dayStrip');
const indicator = document.getElementById('indicator');
const track = document.getElementById('track');
const dotsEl = document.getElementById('dots');
const dayNameEl = document.getElementById('dayName');
const dayDateEl = document.getElementById('dayDate');
const lessonCountEl = document.getElementById('lessonCount');

const todayISO = new Date().toISOString().slice(0,10);
let todayIndex = WEEK.findIndex(d => d.iso === todayISO);
if(todayIndex === -1) todayIndex = 0;
let current = todayIndex;

function timeToMinutes(t){ const [h,m]=t.split(':').map(Number); return h*60+m; }
function nowMinutes(){ const n=new Date(); return n.getHours()*60+n.getMinutes(); }

function buildPane(day){
  const pane = document.createElement('div');
  pane.className = 'day-pane';

  if(day.lessons.length === 0){
    pane.innerHTML = `
      <div class="restday">
        <div class="glyph">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#96979C" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <path d="M8 3v4M16 3v4M4 9h16M5 6h14a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1z"/>
          </svg>
        </div>
        <h2>Dam olish kuni</h2>
        <p>Bu kunga dars belgilanmagan.</p>
      </div>`;
    return pane;
  }

  const isToday = day.iso === todayISO;
  const nm = nowMinutes();
  const list = document.createElement('div');
  list.className = 'list';

  day.lessons.forEach((l, i) => {
    const isNow = isToday && nm >= timeToMinutes(l.t1) && nm < timeToMinutes(l.t2);
    const row = document.createElement('div');
    row.className = 'row' + (isNow ? ' now' : '');
    row.innerHTML = `
      <div class="num">${i+1}</div>
      <div class="info">
        <div class="subj">${l.subj}</div>
        <div class="teacher">${l.teacher}</div>
      </div>
      ${isNow ? '<span class="now-tag">Hozir</span>' : ''}`;
    list.appendChild(row);
  });

  pane.appendChild(list);
  return pane;
}

WEEK.forEach(day => track.appendChild(buildPane(day)));

WEEK.forEach((day, i) => {
  const pill = document.createElement('div');
  pill.className = 'pill' + (day.iso === todayISO ? ' today' : '');
  pill.innerHTML = `<div class="pd">${day.short}</div><div class="pn">${day.date.split(' ')[0]}</div>`;
  pill.addEventListener('click', () => goTo(i));
  dayStrip.appendChild(pill);

  const dot = document.createElement('span');
  dotsEl.appendChild(dot);
});

function positionIndicator(){
  const pill = dayStrip.querySelectorAll('.pill')[current];
  if(!pill) return;
  indicator.style.width = pill.offsetWidth + 'px';
  indicator.style.transform = `translateX(${pill.offsetLeft - 4}px)`;
}

function render(){
  track.style.transition = 'transform .3s cubic-bezier(.22,.61,.36,1)';
  track.style.transform = `translateX(-${current * 100}%)`;
  const day = WEEK[current];
  dayNameEl.textContent = day.name;
  dayDateEl.textContent = day.date;
  lessonCountEl.textContent = day.lessons.length;
  [...dayStrip.querySelectorAll('.pill')].forEach((p,i) => p.classList.toggle('active', i === current));
  [...dotsEl.children].forEach((d,i) => d.classList.toggle('on', i === current));
  positionIndicator();
}

function goTo(i){
  current = Math.max(0, Math.min(WEEK.length-1, i));
  render();
}

/* swipe (hand drag only, no arrows) */
const viewport = document.getElementById('viewport');
let startX=0, startY=0, dx=0, dragging=false, locked=null;

viewport.addEventListener('touchstart', e => {
  startX = e.touches[0].clientX;
  startY = e.touches[0].clientY;
  dx = 0; dragging = true; locked = null;
  track.style.transition = 'none';
}, {passive:true});

viewport.addEventListener('touchmove', e => {
  if(!dragging) return;
  const x = e.touches[0].clientX;
  const y = e.touches[0].clientY;
  dx = x - startX;
  const dy = y - startY;
  if(locked === null) locked = Math.abs(dx) > Math.abs(dy) ? 'x' : 'y';
  if(locked === 'x'){
    const base = -current * viewport.clientWidth;
    track.style.transform = `translateX(${base + dx}px)`;
  }
}, {passive:true});

viewport.addEventListener('touchend', () => {
  if(!dragging) return;
  dragging = false;
  if(locked === 'x'){
    const threshold = viewport.clientWidth * 0.18;
    if(dx < -threshold && current < WEEK.length-1) current++;
    else if(dx > threshold && current > 0) current--;
  }
  render();
});

window.addEventListener('resize', positionIndicator);
render();
setInterval(render, 60000);
</script>
</body>
</html>
